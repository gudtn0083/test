<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보안 강화된 귀여운 동물 생성기</title>
    
    <!-- Content Security Policy for XSS prevention -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';">
    
    <!-- Security headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    
    <style>
        /* CSS injection prevention - 모든 스타일을 내부에 정의 */
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --success-color: #4CAF50;
            --danger-color: #ff6b6b;
            --warning-color: #ffa500;
            --background-light: rgba(255,255,255,0.9);
            --shadow-light: rgba(0,0,0,0.1);
            --shadow-medium: rgba(0,0,0,0.2);
            --shadow-heavy: rgba(0,0,0,0.3);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            overflow-x: hidden; /* Prevent horizontal scrolling attacks */
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        
        h1 {
            color: white;
            margin-bottom: 30px;
            font-size: clamp(1.5rem, 4vw, 2.5rem); /* Responsive font size */
            text-shadow: 2px 2px 4px var(--shadow-heavy);
            word-wrap: break-word; /* Prevent text overflow */
        }
        
        .security-info {
            background: var(--background-light);
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            border-left: 4px solid var(--success-color);
            text-align: left;
            font-size: 0.9rem;
        }
        
        .animals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        
        .animal-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px var(--shadow-medium);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden; /* Prevent content overflow */
            max-width: 100%; /* Prevent oversized cards */
        }
        
        .animal-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px var(--shadow-heavy);
        }
        
        .animal-card:focus {
            outline: 3px solid var(--primary-color);
            outline-offset: 2px;
        }
        
        .animal-name {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            word-wrap: break-word;
        }
        
        .controls {
            background: var(--background-light);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            box-shadow: 0 5px 15px var(--shadow-light);
        }
        
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        button {
            background: var(--success-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
            min-width: 120px;
            position: relative;
            overflow: hidden;
        }
        
        button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        
        button:focus {
            outline: 3px solid var(--primary-color);
            outline-offset: 2px;
        }
        
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .random-btn {
            background: var(--danger-color);
        }
        
        .random-btn:hover:not(:disabled) {
            background: #ee5a5a;
        }
        
        .clear-btn {
            background: var(--warning-color);
        }
        
        .clear-btn:hover:not(:disabled) {
            background: #e6940a;
        }
        
        .rate-limit-warning {
            color: var(--danger-color);
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }
        
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        
        /* Accessibility improvements */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 0 10px;
            }
            
            .animals-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
            }
            
            button {
                min-width: 100px;
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐾 보안 강화된 귀여운 동물 생성기 🐾</h1>
        
        <div class="security-info">
            <strong>🔒 보안 기능:</strong> XSS 방지, CSP 헤더, 입력 검증, Rate Limiting, 안전한 DOM 조작
        </div>
        
        <div class="animals-grid" id="animalsGrid" role="main" aria-label="생성된 동물들">
            <!-- 동물들이 여기에 안전하게 생성됩니다 -->
        </div>
        
        <div class="controls">
            <div class="button-group" role="toolbar" aria-label="동물 생성 도구">
                <button onclick="secureGenerateAnimal('bear')" aria-label="곰 생성">곰 🐻</button>
                <button onclick="secureGenerateAnimal('cat')" aria-label="고양이 생성">고양이 🐱</button>
                <button onclick="secureGenerateAnimal('dog')" aria-label="강아지 생성">강아지 🐶</button>
                <button onclick="secureGenerateAnimal('rabbit')" aria-label="토끼 생성">토끼 🐰</button>
            </div>
            <div class="button-group">
                <button onclick="secureGenerateAnimal('fox')" aria-label="여우 생성">여우 🦊</button>
                <button onclick="secureGenerateAnimal('panda')" aria-label="판다 생성">판다 🐼</button>
                <button onclick="secureGenerateAnimal('pig')" aria-label="돼지 생성">돼지 🐷</button>
                <button onclick="secureGenerateAnimal('frog')" aria-label="개구리 생성">개구리 🐸</button>
            </div>
            <div class="button-group">
                <button class="random-btn" onclick="secureGenerateRandomAnimals()" aria-label="랜덤 동물들 생성">랜덤 생성! 🎲</button>
                <button class="clear-btn" onclick="secureClearAnimals()" aria-label="모든 동물 지우기">지우기 🗑️</button>
            </div>
            <div class="rate-limit-warning" id="rateLimitWarning" role="alert">
                너무 빠른 요청입니다. 잠시 기다려주세요.
            </div>
        </div>
    </div>

    <script>
        'use strict'; // Strict mode for better error handling
        
        // Security and rate limiting configuration
        const SECURITY_CONFIG = {
            MAX_ANIMALS: 50, // Maximum number of animals on screen
            RATE_LIMIT_MS: 100, // Minimum time between requests
            MAX_REQUESTS_PER_MINUTE: 60,
            ALLOWED_ANIMAL_TYPES: ['bear', 'cat', 'dog', 'rabbit', 'fox', 'panda', 'pig', 'frog'],
            MAX_SVG_SIZE: 200, // Maximum SVG dimensions
            MAX_ANIMATION_COUNT: 20 // Maximum concurrent animations
        };
        
        // Rate limiting state
        let lastRequestTime = 0;
        let requestCount = 0;
        let requestTimes = [];
        let animationCount = 0;
        
        // Input validation and sanitization
        function validateAnimalType(type) {
            if (typeof type !== 'string') {
                console.warn('Invalid animal type: not a string');
                return false;
            }
            
            // Sanitize input - only allow alphanumeric characters
            const sanitized = type.replace(/[^a-zA-Z]/g, '').toLowerCase();
            
            if (!SECURITY_CONFIG.ALLOWED_ANIMAL_TYPES.includes(sanitized)) {
                console.warn(`Invalid animal type: ${type}`);
                return false;
            }
            
            return sanitized;
        }
        
        // Rate limiting check
        function checkRateLimit() {
            const now = Date.now();
            
            // Check minimum time between requests
            if (now - lastRequestTime < SECURITY_CONFIG.RATE_LIMIT_MS) {
                showRateLimitWarning();
                return false;
            }
            
            // Check requests per minute
            requestTimes = requestTimes.filter(time => now - time < 60000);
            if (requestTimes.length >= SECURITY_CONFIG.MAX_REQUESTS_PER_MINUTE) {
                showRateLimitWarning();
                return false;
            }
            
            lastRequestTime = now;
            requestTimes.push(now);
            return true;
        }
        
        function showRateLimitWarning() {
            const warning = document.getElementById('rateLimitWarning');
            if (warning) {
                warning.style.display = 'block';
                setTimeout(() => {
                    warning.style.display = 'none';
                }, 3000);
            }
        }
        
        // Secure DOM manipulation
        function createSecureElement(tagName, properties = {}) {
            const element = document.createElement(tagName);
            
            // Safely set properties
            Object.keys(properties).forEach(key => {
                if (key === 'textContent') {
                    element.textContent = properties[key]; // Safe from XSS
                } else if (key === 'innerHTML') {
                    // Only allow if it's our trusted SVG content
                    if (properties[key].startsWith('<svg') && properties[key].endsWith('</svg>')) {
                        element.innerHTML = properties[key];
                    }
                } else if (key === 'className') {
                    element.className = properties[key];
                } else if (key.startsWith('aria-') || key.startsWith('data-')) {
                    element.setAttribute(key, String(properties[key]));
                }
            });
            
            return element;
        }
        
        // Secure color validation
        function validateColor(color) {
            if (typeof color !== 'string') return false;
            
            // Allow only hex colors and named colors
            const hexPattern = /^#[0-9A-Fa-f]{6}$/;
            const namedColors = ['red', 'blue', 'green', 'yellow', 'orange', 'purple', 'pink', 'brown', 'black', 'white', 'gray', 'grey'];
            
            return hexPattern.test(color) || namedColors.includes(color.toLowerCase());
        }

                                </filter>
                            </defs>
                            <!-- 머리 -->

                            <circle cx="100" cy="45" r="12" fill="${safeColors.inner}"/>
                            
                            <!-- 눈 -->
                            <circle cx="60" cy="60" r="8" fill="white"/>

                            <circle cx="60" cy="60" r="5" fill="black"/>

                            <circle cx="62" cy="58" r="2" fill="white"/>

                            <!-- 코와 입 -->
                            <ellipse cx="75" cy="75" rx="4" ry="3" fill="black"/>
                            <path d="M 75 78 Q 70 85 65 82" stroke="black" stroke-width="2" fill="none"/>
                            <path d="M 75 78 Q 80 85 85 82" stroke="black" stroke-width="2" fill="none"/>
                            
                            <!-- 몸 -->
                            <ellipse cx="75" cy="125" rx="30" ry="20" fill="${safeColors.main}"/>
                        </svg>
                    `;
                }
            },

                            <!-- 몸 -->

                        </svg>

                }
            },
            
            dog: {

                colors: {

                },
                generateSVG: function(colors) {
                    const safeColors = {

                        <svg width="${SECURITY_CONFIG.MAX_SVG_SIZE}" height="${SECURITY_CONFIG.MAX_SVG_SIZE}" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                                    <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
                                </filter>
                            </defs>
                            <!-- 머리 -->
                            <ellipse cx="75" cy="70" rx="35" ry="40" fill="${safeColors.main}" filter="url(#shadow)"/>

                            <!-- 주둥이 -->

                            <!-- 눈 -->
                            <circle cx="65" cy="60" r="6" fill="black"/>
                            <circle cx="85" cy="60" r="6" fill="black"/>
                            <circle cx="67" cy="58" r="2" fill="white"/>

                            <!-- 코 -->
                            <circle cx="75" cy="80" r="3" fill="black"/>
                            
                            <!-- 입 -->

            rabbit: {

                generateSVG: function(colors) {

                    return `

            panda: {
                name: '판다',
                colors: {

        // Secure animal generation function
        function secureGenerateAnimal(type) {
            try {
                // Check rate limiting
                if (!checkRateLimit()) {
                    return;
                }
                
                // Validate input
                const validatedType = validateAnimalType(type);
                if (!validatedType) {
                    console.error('Invalid animal type provided');
                    return;
                }
                
                // Check maximum animals limit
                const grid = document.getElementById('animalsGrid');
                if (!grid) {
                    console.error('Animals grid not found');
                    return;
                }
                
                if (grid.children.length >= SECURITY_CONFIG.MAX_ANIMALS) {
                    alert(`최대 ${SECURITY_CONFIG.MAX_ANIMALS}개의 동물만 생성할 수 있습니다.`);
                    return;
                }
                
                // Generate secure animal
                const animal = generateSecureAnimal(validatedType);
                if (animal) {
                    addSecureAnimalToGrid(animal);
                }
                
            } catch (error) {
                console.error('Error generating animal:', error);
            }
        }
        
        function generateSecureAnimal(type, customColors = null) {
            const template = secureAnimalTemplates[type];
            if (!template) {
                console.error(`Template not found for type: ${type}`);
                return null;
            }
            
            let animalColors = customColors || { ...template.colors };
            
            // Add color variation if no custom colors provided
            if (!customColors) {
                const variation = (Math.random() * 0.3) - 0.15; // -15% to +15%
                animalColors = {
                    main: adjustBrightnessSecurely(animalColors.main, variation),
                    secondary: adjustBrightnessSecurely(animalColors.secondary, variation),
                    inner: adjustBrightnessSecurely(animalColors.inner, variation)
                };
            }
            
            return {
                type: type,
                name: template.name,
                svg: template.generateSVG(animalColors),
                timestamp: Date.now()
            };
        }
        
        function adjustBrightnessSecurely(color, percent) {
            try {
                // Validate input
                if (!validateColor(color) || typeof percent !== 'number' || isNaN(percent)) {
                    return color; // Return original if invalid
                }
                
                // Clamp percent to safe range
                percent = Math.max(-0.5, Math.min(0.5, percent));
                
                // Convert hex to RGB
                const hex = color.replace('#', '');
                if (hex.length !== 6) return color;
                
                const num = parseInt(hex, 16);
                if (isNaN(num)) return color;
                
                const amt = Math.round(2.55 * percent * 100);
                const R = Math.max(0, Math.min(255, (num >> 16) + amt));
                const G = Math.max(0, Math.min(255, (num >> 8 & 0x00FF) + amt));
                const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
                
                return "#" + ((R << 16) | (G << 8) | B).toString(16).padStart(6, '0');
                
            } catch (error) {
                console.warn('Error adjusting brightness:', error);
                return color;
            }
        }
        
        function addSecureAnimalToGrid(animal) {
            try {
                const grid = document.getElementById('animalsGrid');
                if (!grid) {
                    console.error('Grid element not found');
                    return;
                }
                
                // Create secure card element
                const card = createSecureElement('div', {
                    className: 'animal-card',
                    'aria-label': `${animal.name} 동물 카드`,
                    'data-animal-type': animal.type,
                    'data-timestamp': animal.timestamp
                });
                
                // Add tabindex for keyboard navigation
                card.setAttribute('tabindex', '0');
                card.setAttribute('role', 'button');
                
                // Safely add SVG content
                const svgContainer = createSecureElement('div', {
                    innerHTML: animal.svg
                });
                
                const nameElement = createSecureElement('div', {
                    className: 'animal-name',
                    textContent: animal.name
                });
                
                card.appendChild(svgContainer);
                card.appendChild(nameElement);
                
                // Add secure event listeners
                const clickHandler = function(event) {
                    event.preventDefault();
                    secureGenerateAnimal(animal.type);
                };
                
                const keyHandler = function(event) {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        secureGenerateAnimal(animal.type);
                    }
                };
                
                card.addEventListener('click', clickHandler);
                card.addEventListener('keydown', keyHandler);
                
                // Add with animation if not exceeding limit
                if (animationCount < SECURITY_CONFIG.MAX_ANIMATION_COUNT) {
                    animationCount++;
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    
                    grid.appendChild(card);
                    
                    // Animate in
                    requestAnimationFrame(() => {
                        card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0)';
                        
                        setTimeout(() => {
                            animationCount--;
                        }, 300);
                    });
                } else {
                    grid.appendChild(card);
                }
                
            } catch (error) {
                console.error('Error adding animal to grid:', error);
            }
        }
        
        function secureGenerateRandomAnimals() {
            try {
                if (!checkRateLimit()) {
                    return;
                }
                
                const animalTypes = Object.keys(secureAnimalTemplates);
                const count = Math.floor(Math.random() * 4) + 3; // 3-6 animals
                
                // Disable button temporarily
                const buttons = document.querySelectorAll('button');
                buttons.forEach(btn => btn.disabled = true);
                
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const randomType = animalTypes[Math.floor(Math.random() * animalTypes.length)];
                        secureGenerateAnimal(randomType);
                        
                        // Re-enable buttons after last animal
                        if (i === count - 1) {
                            setTimeout(() => {
                                buttons.forEach(btn => btn.disabled = false);
                            }, 200);
                        }
                    }, i * 300); // Staggered generation
                }
                
            } catch (error) {
                console.error('Error generating random animals:', error);
                // Re-enable buttons on error
                document.querySelectorAll('button').forEach(btn => btn.disabled = false);
            }
        }
        
        function secureClearAnimals() {
            try {
                if (!checkRateLimit()) {
                    return;
                }
                
                const grid = document.getElementById('animalsGrid');
                if (!grid) {
                    console.error('Grid element not found');
                    return;
                }
                
                // Animate out and remove
                const cards = Array.from(grid.children);
                cards.forEach((card, index) => {
                    setTimeout(() => {
                        card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                        card.style.opacity = '0';
                        card.style.transform = 'translateY(-20px)';
                        
                        setTimeout(() => {
                            if (card.parentNode) {
                                card.parentNode.removeChild(card);
                            }
                        }, 300);
                    }, index * 50);
                });
                
            } catch (error) {
                console.error('Error clearing animals:', error);
            }
        }
        
        // Secure keyboard event handler
        function handleSecureKeydown(event) {
            try {
                // Only handle if no input elements are focused
                if (document.activeElement.tagName === 'INPUT' || 
                    document.activeElement.tagName === 'TEXTAREA') {
                    return;
                }
                
                const key = event.key.toLowerCase();
                
                if (key === 'r') {
                    event.preventDefault();
                    secureGenerateRandomAnimals();
                } else if (key === 'c') {
                    event.preventDefault();
                    secureClearAnimals();
                } else if (key === 'escape') {
                    // Remove focus from any focused element
                    if (document.activeElement) {
                        document.activeElement.blur();
                    }
                }
                
            } catch (error) {
                console.error('Error handling keyboard event:', error);
            }
        }
        
        // Initialize secure application
        function initializeSecureApp() {
            try {
                // Set up secure event listeners
                document.addEventListener('keydown', handleSecureKeydown);
                
                // Add focus management
                document.addEventListener('focusin', function(event) {
                    if (event.target.classList.contains('animal-card')) {
                        event.target.style.outline = '3px solid var(--primary-color)';
                        event.target.style.outlineOffset = '2px';
                    }
                });
                
                document.addEventListener('focusout', function(event) {
                    if (event.target.classList.contains('animal-card')) {
                        event.target.style.outline = '';
                        event.target.style.outlineOffset = '';
                    }
                });
                
                // Generate initial animals securely
                setTimeout(() => {
                    secureGenerateRandomAnimals();
                }, 500);
                
                console.log('Secure animal generator initialized successfully');
                
            } catch (error) {
                console.error('Error initializing secure app:', error);
            }
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeSecureApp);
        } else {
            initializeSecureApp();
        }
        
        // Error boundary for unhandled errors
        window.addEventListener('error', function(event) {
            console.error('Unhandled error:', event.error);
            // Don't expose error details to user
            return true;
        });
        
        // Prevent context menu in production (optional)
        // document.addEventListener('contextmenu', function(event) {
        //     event.preventDefault();
        // });
        
    </script>
